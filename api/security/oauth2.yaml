type: oauth2
description: |
  An access token of the OIDC provider the server is configured against, sent as
  `Authorization: Bearer {token}`.
flows:
  authorizationCode:
    authorizationUrl: https://auth.wvl.app/oauth/authorize
    tokenUrl: https://auth.wvl.app/oauth/token
    scopes:
      score_viewer: allows to view scores
      score_editor: allows to edit scores