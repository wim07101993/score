type: object
description: |
  One score as it is played at one point in a gig, as the client states it.

  It is the read entry without `id`: which row an entry is stored as is the
  server's to decide, and a client that could name it could point a second set's
  entry at the first set's row.
required:
  - score_id
  - description
  - transposition
  - hidden_parts
properties:
  score_id:
    type: string
    format: uuid
    description: The score that is played.
  description:
    type: string
    description: |
      Whatever the player needs to remember about this one.
    examples: [capo 2, second verse only, straight into the next]
  transposition:
    type: integer
    minimum: -12
    maximum: 12
    description: |
      How far the score is transposed, in semitones, negative for down. The
      range is the one the player offers.
    examples: [-2]
  hidden_parts:
    type: array
    description: |
      The parts of the score that are off screen, by their MusicXML part id.
    items:
      type: string
    examples:
      - [P2]
