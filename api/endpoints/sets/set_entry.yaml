# One score as it is played at one point in a gig.
#
# This file is not a document of its own. It is what the entries of a set are,
# and it is read through the references set.yaml and write_set.yaml make into
# it. Both point here: what a client states about an entry is the whole of an
# entry, so unlike the set around it there is nothing to leave out.

type: object
required:
  - id
  - score_id
  - description
  - transposition
  - hidden_parts
properties:
  id:
    type: string
    format: uuid
    description: |
      The id of this entry.

      It belongs to the entry rather than to the score, because the same score
      may be played more than once in a gig, each time with its own key and its
      own note next to it.
  score_id:
    type: string
    format: uuid
    description: The score that is played.
  description:
    type: string
    description: |
      Whatever the player needs to remember about this one.
    examples: [capo 2, second verse only, straight into the next]
  transposition:
    type: integer
    minimum: -12
    maximum: 12
    description: |
      How far the score is transposed, in semitones, negative for down. The
      range is the one the player offers.
    examples: [-2]
  hidden_parts:
    type: array
    description: |
      The parts of the score that are off screen, by their MusicXML part id.
    items:
      type: string
    examples:
      - [P2]
