parameters:
  - $ref: '../../../parameters/collection_id.yaml'
  - $ref: '../../../parameters/correlation_id.yaml'

get:
  operationId: getCollection
  summary: Fetch a single collection.
  description: |
    Returns the collection, whether the caller owns it or it is shared with
    them. `is_owner` says which of the two it is, and `shared_with` is only
    filled in for the owner.

    The pieces come back by title. A collection has no order of its own, so that
    is not one: it is the order a list somebody is looking through should be in.

    Requires the `score_viewer` role.
  tags: [collections]
  security:
    - oauth2: [score_viewer]
  responses:
    '200':
      description: The collection.
      content:
        application/json:
          schema:
            $ref: '../collection.yaml'
    '400':
      $ref: '../../../responses/400_bad_request.yaml'
    '401':
      $ref: '../../../responses/401_unauthorized.yaml'
    '403':
      $ref: '../../../responses/403_forbidden.yaml'
    '404':
      $ref: '../../../responses/404_not_found.yaml'
    default:
      $ref: '../../../responses/xxx_unknown_error.yaml'

put:
  operationId: putCollection
  summary: Create or replace a collection.
  description: |
    Stores the collection under the given id, replacing whatever was stored
    under it before, and returns it as it now reads. A collection that is not
    there yet belongs to whoever creates it; one that is can only be written by
    its owner.

    What is in the collection is not written here and is not touched by writing
    here: an entry is a resource of its own, so a collection is created empty
    and filled afterwards.

    Writing a collection that had been deleted brings it back: a client that
    still has it and edits it is saying it should exist.

    Requires the `score_viewer` role. A collection names scores but changes
    nothing about them, so building one asks no more of a user than reading the
    scores in it.
  tags: [collections]
  security:
    - oauth2: [score_viewer]
  requestBody:
    required: true
    description: The collection as the client states it.
    content:
      application/json:
        schema:
          $ref: '../write_collection.yaml'
  responses:
    '200':
      description: The collection as it now reads.
      content:
        application/json:
          schema:
            $ref: '../collection.yaml'
    '400':
      $ref: '../../../responses/400_bad_request.yaml'
    '401':
      $ref: '../../../responses/401_unauthorized.yaml'
    '403':
      $ref: '../../../responses/403_forbidden.yaml'
    '413':
      $ref: '../../../responses/413_content_too_large.yaml'
    '415':
      $ref: '../../../responses/415_unsupported_media_type.yaml'
    default:
      $ref: '../../../responses/xxx_unknown_error.yaml'

delete:
  operationId: deleteCollection
  summary: Delete a collection.
  description: |
    Marks the collection as deleted. It is kept rather than removed, and it
    keeps turning up in the change window with `deleted_at` filled in, so that a
    client holding a copy learns that it is gone.

    Only the owner of a collection can delete it. A collection that is not
    there, already deleted, or not the caller's is answered the same way.

    Requires the `score_viewer` role.
  tags: [collections]
  security:
    - oauth2: [score_viewer]
  responses:
    '204':
      description: The collection was deleted.
    '400':
      $ref: '../../../responses/400_bad_request.yaml'
    '401':
      $ref: '../../../responses/401_unauthorized.yaml'
    '403':
      $ref: '../../../responses/403_forbidden.yaml'
    '404':
      $ref: '../../../responses/404_not_found.yaml'
    default:
      $ref: '../../../responses/xxx_unknown_error.yaml'
