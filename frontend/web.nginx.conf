server {
    listen       80;
    # IPv6 is listened on only where the host has it, which
    # web.nginx-listen-on-ipv6.sh decides when the container starts: a listen
    # written here unconditionally stops nginx from starting at all on a host
    # booted without IPv6. The stock image does the same for its own config and
    # leaves a replaced one alone.
    #ipv6 listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Nothing the Flutter web build emits is content-hashed: main.dart.js,
    # flutter.js, flutter_bootstrap.js, the service worker, version.json,
    # manifest.json, canvaskit/ and assets/ (config.json among them) all keep
    # the same name from one release to the next. So every file is revalidated
    # on every load. That costs a conditional request that answers 304 with the
    # ETag nginx already sends, rather than a returning visitor running a
    # mixture of two builds, or the old config against the new API. (A browser
    # that has the app kept by its service worker does not ask at all; the
    # worker itself is what is revalidated, and that is what brings a release.)
    add_header Cache-Control "no-cache";

    # The app is some 19 MB before compression and fetched whole the first
    # time — on whatever network the player has — so it is compressed on the
    # way. The engine and the fonts are served as wasm and as octet-stream.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/octet-stream
        image/svg+xml;

    # Routing happens in the app, not here: a deep link still has to boot the
    # shell rather than come back a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
