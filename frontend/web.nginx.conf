server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # These three decide which build a returning visitor actually runs, so they
    # have to be revalidated every time. Everything else the Flutter build emits
    # is content-hashed, so the default caching is safe for it.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }
    location = /version.json {
        add_header Cache-Control "no-cache";
    }

    # Routing happens in the app, not here: a deep link still has to boot the
    # shell rather than come back a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
