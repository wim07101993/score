name: score
description: Sheet music, drawn and played from.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  auto_route: ^11.2.0
  behaviour: ^3.0.2
  # Hashing the files of a web build, so that the service worker fetches only
  # what changed (tool/precache.dart).
  crypto: ^3.0.5
  # Reading a score off the device and writing one back to it.
  file_picker: ^11.0.3
  flutter:
    sdk: flutter
  flutter_fox_logging: ^2.2.0
  # Signing in on a phone: opens the provider and catches the callback. On the
  # web the page itself is the callback, so it is not used there.
  flutter_web_auth_2: ^5.0.3
  # Only for the path url strategy, which keeps the web app's addresses plain
  # paths rather than `/#/…`.
  flutter_web_plugins:
    sdk: flutter
  fox_logging: ^1.1.0
  get_it: ^9.3.0
  # Talking to the API and to the identity provider.
  http: ^1.2.2
  logging: ^1.3.0
  openid_client: ^0.4.10+1
  # Where the database and the score files are kept on a device.
  path: ^1.9.0
  path_provider: ^2.1.4
  # What is kept between visits. One database that works the same on a browser
  # (IndexedDB) and on a device (a file), so nothing above the stores ever asks
  # which one it is on.
  sembast: ^3.7.4
  # Exact, not a range: in debug builds lib/storage/database_factory_web.dart
  # recognises sembast_web's cross-tab channel by a name that is private to
  # the package, read from this version. Moving to another one is a choice to
  # check that name again, not something `pub upgrade` should do on its own.
  sembast_web: 2.4.5+1
  # The score engine. Reading a MusicXML file, engraving what it says, and
  # writing it back out — the model, the layout and the painter all come from
  # here, so nothing in this app knows what a beam or a ledger line is.
  songbird_music_notation: ^0.1.1
  songbird_musicxml: ^0.1.1
  songbird_score: ^0.1.0
  # Signing in on a desktop: the callback comes back to a port this app
  # listens on itself (lib/features/auth/storage/authorizer_native.dart), which
  # opens the provider in the browser with this and brings the app back to the
  # front with the next one.
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  web: ^1.1.0
  window_to_front: ^0.0.3

dev_dependencies:
  auto_route_generator: ^10.6.0
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  lint: ^2.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/config.json

  # The text of the app, shipped with it rather than fetched. On the web a font
  # nobody bundled is downloaded from Google's servers at every start, which is
  # a page with no letters on it where there is no network — and the web app
  # has to work there. Everywhere else it is the font Material asks for anyway.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
        - asset: assets/fonts/roboto/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 700

