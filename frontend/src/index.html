<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Score</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="theme.css">
</head>

<body>

<header>
    <h1 id="title">Scores</h1>
    <!-- Never hidden, whatever roles the user turns out to have: a user who is
         shown nothing at all is exactly the user who needs to see why. -->
    <a id="profile-button" href="profile.html">Profile</a>
    <a id="sets-button" hidden href="sets/">Sets</a>
    <a id="upload-button" hidden href="scores/detail.html">
        <svg xmlns="http://www.w3.org/2000/svg"
             width="24px"
             height="24px"
             viewBox="0 0 20 20">
            <path d="M13 10v6H7v-6H2l8-8l8 8h-5zM0 18h20v2H0v-2z"/>
        </svg>
    </a>
</header>

<div id="score-list">
</div>

<script src="index.js" type="module"></script>
<script>
    async function registerServiceWorker() {
        if ("serviceWorker" in navigator) {
            try {
                const registration = await navigator.serviceWorker.register(
                    "service-worker.js"
                );
                console.log(
                    "Service Worker registered with scope:",
                    registration.scope
                );
            } catch (error) {
                console.error("Service Worker registration failed:", error);
            }
        }
    }
    registerServiceWorker();
</script>
</body>
</html>
