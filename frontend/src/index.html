<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Scores</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="index.css">
</head>

<body>

<header class="topbar">
    <div class="page topbar-inner">
        <h1 id="title">Scores</h1>
        <!-- Never hidden, whatever roles the user turns out to have: a user who
             is shown nothing at all is exactly the user who needs to see why. -->
        <a id="profile-button" class="button button--quiet" href="profile.html">Profile</a>
        <a id="sets-button" class="button button--quiet" hidden href="sets/">Sets</a>
        <a id="upload-button" class="button button--primary" hidden href="scores/detail.html">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="18" height="18"
                 aria-hidden="true" focusable="false" style="fill: currentColor">
                <path d="M13 10v6H7v-6H2l8-8l8 8h-5zM0 18h20v2H0v-2z"/>
            </svg>
            <!-- On a phone there is no room for the words next to the title, and
                 an arrow into a page called "New score" says it anyway. -->
            <span class="wide-only">New score</span>
        </a>
    </div>
</header>

<main class="page">
    <p id="empty-notice" class="muted" hidden>
        No scores on this device yet.
    </p>
    <div id="score-list"></div>
</main>

<script src="index.js" type="module"></script>
<script>
    async function registerServiceWorker() {
        if ("serviceWorker" in navigator) {
            try {
                const registration = await navigator.serviceWorker.register(
                    "service-worker.js"
                );
                console.log(
                    "Service Worker registered with scope:",
                    registration.scope
                );
            } catch (error) {
                console.error("Service Worker registration failed:", error);
            }
        }
    }
    registerServiceWorker();
</script>
</body>
</html>
