<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Scores</title>
    <script src="theme-boot.js"></script>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="index.css">
</head>

<body>

<header class="topbar">
    <!-- Wider than the rest of the app: this page is a list beside the ways of
         narrowing it, and two columns in a column of reading width is two
         narrow columns. The bar is widened with it so that the title stays
         over the list. -->
    <div class="page page--library topbar-inner">
        <h1 id="title">Scores</h1>
        <!-- Neither of these is ever hidden, whatever roles the user turns out
             to have: a user who is shown nothing at all is exactly the user who
             needs to see why, and to be able to turn the lamp up. -->
        <a id="settings-button" class="button button--quiet button--icon" href="settings.html"
           aria-label="Settings">
            <!-- Sliders rather than a cog: what is behind this is a lamp being
                 turned up and down, and the drawing may as well say so. -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/>
            </svg>
        </a>
        <a id="profile-button" class="button button--quiet" href="profile.html">Profile</a>
        <a id="sets-button" class="button button--quiet" hidden href="sets/">Sets</a>
        <a id="collections-button" class="button button--quiet" hidden href="collections/">Collections</a>
        <a id="upload-button" class="button button--primary" hidden href="scores/detail.html">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="18" height="18"
                 aria-hidden="true" focusable="false" style="fill: currentColor">
                <path d="M13 10v6H7v-6H2l8-8l8 8h-5zM0 18h20v2H0v-2z"/>
            </svg>
            <!-- On a phone there is no room for the words next to the title, and
                 an arrow into a page called "New score" says it anyway. -->
            <span class="wide-only">New score</span>
        </a>
    </div>
</header>

<main class="page page--library">
    <!-- A library is looked through by name, and a list of a few hundred is a
         list nobody scrolls. What is typed here never leaves the device: the
         scores are all on it, so the search is over what is in front of you
         rather than a question to ask a server that may not be there. -->
    <div id="search-row" hidden>
        <label class="visually-hidden" for="score-search">Search the scores</label>
        <input type="search" id="score-search" class="input" autocomplete="off"
               placeholder="Search by title, composer, instrument or tag"/>
    </div>

    <div id="library">
        <!-- The other way of looking: the words the library is actually made of.
             A search box needs you to know what you are looking for, and a
             player who wants "something for two voices in dutch" does not. It
             is a details element so that on a phone it can be one line the list
             is not fighting with; the page opens it where there is room. -->
        <aside id="filters" hidden>
            <details id="filters-details">
                <summary id="filters-summary">Filters</summary>
                <div id="filters-body"></div>
            </details>
        </aside>

        <div id="library-list">
            <p id="empty-notice" class="muted" hidden>
                No scores on this device yet.
            </p>
            <p id="search-notice" class="muted" hidden></p>
            <div id="score-list"></div>
        </div>
    </div>
</main>

<!-- Which sets and collections a score is in, asked and answered without
     leaving the list: putting a piece into a gig is a thing you do while
     reading down the library, and a page of its own to come back from is a
     page in the way. -->
<dialog id="filing-dialog" class="filing-dialog" aria-label="Sets and collections">
    <div id="filing-body"></div>
</dialog>

<script src="index.js" type="module"></script>
</body>
</html>
