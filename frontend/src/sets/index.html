<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sets</title>
    <link rel="stylesheet" href="../theme.css">
    <link rel="stylesheet" href="index.css">
</head>

<body>

<header>
    <a id="home-button" href="/">Scores</a>
    <h1 id="title">Sets</h1>
    <a id="new-set-button" hidden href="detail.html">
        <svg xmlns="http://www.w3.org/2000/svg"
             width="24px"
             height="24px"
             viewBox="0 0 20 20">
            <path d="M9 9V2h2v7h7v2h-7v7H9v-7H2V9h7z"/>
        </svg>
    </a>
</header>

<p id="offline-notice" hidden>
    The server cannot be reached. What is here is what this device knows; edits
    are kept and sent as soon as it can be reached again.
</p>

<div id="set-list"></div>

<p id="empty-notice" hidden>
    No sets yet. A set is a playlist for a gig: the scores that are played, in
    playing order, each in the key it is played in.
</p>

<script src="index.js" type="module"></script>
<script>
    async function registerServiceWorker() {
        if ("serviceWorker" in navigator) {
            try {
                const registration = await navigator.serviceWorker.register(
                    "../service-worker.js"
                );
                console.log(
                    "Service Worker registered with scope:",
                    registration.scope
                );
            } catch (error) {
                console.error("Service Worker registration failed:", error);
            }
        }
    }
    registerServiceWorker();
</script>
</body>
</html>
