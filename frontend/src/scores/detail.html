<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Score detail</title>
    <link rel="stylesheet" href="../theme.css">
    <link rel="stylesheet" href="detail.css">
</head>

<body>
<header>
    <a id="home-button" href="/">Back to the list</a>
    <form id='upload-form' hidden>
        <input type='file' id='file-input' name='file'/>
        <button type='submit' id="upload-button" disabled>
            Upload
        </button>
    </form>
    <details id="download-menu" hidden>
        <!-- There is nothing here but an icon, so the name of the control has
             to be said out loud: a tooltip is for whoever is already looking at
             it with a mouse, and is not something a screen reader can be
             relied on to read out. -->
        <summary id="download-button" aria-label="Download this score"
                 title="Download this score">
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="20px"
                 height="20px"
                 viewBox="0 0 20 20"
                 aria-hidden="true"
                 focusable="false">
                <path d="M13 8V2H7v6H2l8 8l8-8h-5zM0 18h20v2H0v-2z"/>
            </svg>
        </summary>

        <div id="download-panel">
            <button type="button" id="download-svg-button"
                    title="A picture of the score exactly as it is on screen. For printing and for reading; it cannot be opened as a score again.">
                Sheet music, as on screen (.svg)
            </button>
            <button type="button" id="download-musicxml-button"
                    title="The score itself, which opens in other music software and can be uploaded here again.">
                Score file (.musicxml)
            </button>
        </div>
    </details>

    <details id="score-view-controls" hidden>
        <summary>View</summary>

        <div id="score-view-panel">
            <fieldset id="transposition">
                <legend>Transpose</legend>
                <label for="transposition-input">semitones</label>
                <input type="range" id="transposition-input"
                       min="-12" max="12" step="1" value="0"
                       list="transposition-steps"/>
                <datalist id="transposition-steps">
                    <option value="-12"></option>
                    <option value="0"></option>
                    <option value="12"></option>
                </datalist>
                <output id="transposition-output" for="transposition-input">0</output>
            </fieldset>

            <fieldset id="parts">
                <legend>Parts</legend>
                <div id="parts-list"></div>
            </fieldset>

            <button type="button" id="reset-view-button" disabled>
                Show as written
            </button>
        </div>
    </details>
</header>

<script src="../packages/open_sheet_music_display.1.8.9.min.js"></script>
<script src="detail.js" type="module"></script>

<div id='score-musicxml' style='width: 100%' hidden></div>

<script>
    async function registerServiceWorker() {
        if ("serviceWorker" in navigator) {
            try {
                const registration = await navigator.serviceWorker.register(
                    "../service-worker.js"
                );
                console.log(
                    "Service Worker registered with scope:",
                    registration.scope
                );
            } catch (error) {
                console.error("Service Worker registration failed:", error);
            }
        }
    }
    registerServiceWorker();
</script>

</body>
</html>
