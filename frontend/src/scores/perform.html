<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Playing</title>
    <link rel="stylesheet" href="../theme.css">
    <link rel="stylesheet" href="perform.css">
</head>

<body>

<!-- The bar sticks rather than being fixed, so the music simply starts after
     it and no script has to measure anything to keep the two apart. -->
<header id="chrome">
    <div id="bar">
        <a id="back-button" class="button button--quiet button--icon" href="detail.html"
           aria-label="Back to the score">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                <path d="M12.6 2.6L11.2 1.2L2.4 10l8.8 8.8l1.4-1.4L5.2 10z"/>
            </svg>
        </a>

        <h1 id="score-title">Playing</h1>

        <details id="download-menu" class="menu" hidden>
            <summary class="button button--quiet button--icon" id="download-button"
                     aria-label="Download this score" title="Download this score">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                    <path d="M13 8V2H7v6H2l8 8l8-8h-5zM0 18h20v2H0v-2z"/>
                </svg>
            </summary>
            <div class="menu-panel stack stack--tight">
                <button type="button" class="button" id="download-svg-button"
                        title="A picture of the score exactly as it is on screen. For printing and for reading; it cannot be opened as a score again.">
                    Sheet music, as on screen (.svg)
                </button>
                <button type="button" class="button" id="download-musicxml-button"
                        title="The score itself, which opens in other music software and can be uploaded here again.">
                    Score file (.musicxml)
                </button>
            </div>
        </details>

        <details id="score-view-controls" class="menu" hidden>
            <summary class="button button--quiet" id="view-button">View</summary>

            <div class="menu-panel stack" id="score-view-panel">
                <div class="stack stack--tight">
                    <label class="label" for="transposition-input">
                        Transpose <output id="transposition-output" for="transposition-input">0</output>
                        semitones
                    </label>
                    <input type="range" id="transposition-input"
                           min="-12" max="12" step="1" value="0"
                           list="transposition-steps"/>
                    <datalist id="transposition-steps">
                        <option value="-12"></option>
                        <option value="0"></option>
                        <option value="12"></option>
                    </datalist>
                </div>

                <div class="stack stack--tight">
                    <span class="label">Parts</span>
                    <div id="parts-list"></div>
                </div>

                <button type="button" class="button" id="reset-view-button" disabled>
                    Show as written
                </button>
            </div>
        </details>
    </div>

    <!-- Where in the gig this is. Only there when the score was opened from a
         set, and the one thing on this page worth reading mid-song. -->
    <div id="set-controls" hidden>
        <a id="set-previous-button" class="button button--quiet button--icon"
           aria-label="The score before this one" title="The score before this one">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                <path d="M12.6 2.6L11.2 1.2L2.4 10l8.8 8.8l1.4-1.4L5.2 10z"/>
            </svg>
        </a>
        <a id="set-button" class="chip" title="Back to the set"></a>
        <span id="set-position" class="muted"></span>
        <a id="set-next-button" class="button button--quiet button--icon"
           aria-label="The score after this one" title="The score after this one">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                <path d="M7.4 2.6l1.4-1.4L17.6 10l-8.8 8.8l-1.4-1.4L14.8 10z"/>
            </svg>
        </a>
        <span id="set-entry-description"></span>
        <button type="button" id="save-view-to-set-button" class="button" hidden disabled
                title="Only you see this. What the band plays is the owner's to say.">
            Save as how I read it
        </button>
    </div>
</header>

<p id="nothing-notice" class="page muted" hidden>
    There is no score to play here.
    <a href="/">Back to the list</a>
</p>

<main id="score-musicxml" hidden></main>

<script src="../packages/open_sheet_music_display.1.8.9.min.js"></script>
<script src="perform.js" type="module"></script>
<script>
    async function registerServiceWorker() {
        if ("serviceWorker" in navigator) {
            try {
                const registration = await navigator.serviceWorker.register("../service-worker.js");
                console.log("Service Worker registered with scope:", registration.scope);
            } catch (error) {
                console.error("Service Worker registration failed:", error);
            }
        }
    }

    registerServiceWorker();
</script>

</body>
</html>
