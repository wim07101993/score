name: Release

on:
  workflow_dispatch:
  push:
    tags: 
    - 'v*'

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and Push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend.Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/score:${{ github.ref_name }} , ${{ secrets.DOCKER_USERNAME }}/score:latest

      # The frontend image is built by flutter-release.yml, which runs off the
      # same tag: it packages the web build the four-platform build already
      # produced rather than building it a second time here.

      - name: Create release
        uses: ncipollo/release-action@v1
