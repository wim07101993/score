name: Release-Dev

on:
  workflow_dispatch:
  push:
    branches: 
      - development

# Read-only: this pushes images to DockerHub, which is done with the DockerHub
# secrets and not with the repository's token.
permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and Push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend.Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/score:dev-latest

  # score-frontend:dev-latest is what a development deployment pulls, so it has
  # to keep being published now that the frontend is the Flutter app: without
  # this the tag would sit at the last build of the web app that is no longer in
  # the repository. Web only — a development push has no use for the installers.
  frontend:
    needs: test
    uses: ./.github/workflows/flutter-build.yml
    with:
      web-only: true

  frontend-image:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: web-build
          # Where web.Dockerfile expects to find it.
          path: frontend/build/web

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/web.Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/score-frontend:dev-latest
