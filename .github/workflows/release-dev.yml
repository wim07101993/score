name: Release-Dev

on:
  workflow_dispatch:
  push:
    branches: 
      - development

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and Push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend.Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/score:dev-latest

      # No frontend image here. The Flutter app reads assets/config.json at
      # start-up rather than having it swapped in at build time, so there is
      # nothing for a dev build of the image to do differently — see
      # flutter-release.yml for the one that is published, off a tag.
