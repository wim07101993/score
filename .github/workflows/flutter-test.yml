name: Flutter Test

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/flutter-*.yml'

# Nothing here writes anything back: it reads the checkout and runs the
# analyzer and the tests. Said out loud so the token cannot do more than that.
permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned: the SDK decides what the analyzer complains about and what
          # the engraving code renders, and neither should change on a day
          # nobody chose it.
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      # --fatal-infos: the analyzer is kept clean, advisory lints included, so
      # anything it has to say is worth stopping for.
      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Unit and widget tests
        run: flutter test
