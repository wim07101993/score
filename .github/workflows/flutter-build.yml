name: Flutter Build

on:
  workflow_call:
    inputs:
      build-args:
        description: >-
          Extra flags handed to every `flutter build`. The release workflow uses
          this to stamp the tag as the version; left empty the version in
          pubspec.yaml is used as it stands.
        type: string
        default: ''
      config:
        description: >-
          A config file to put in place of `assets/config.json` before
          building. Named rather than always swapped, because the file in the
          tree is the development one and that is what a branch build should
          keep pointing at; a release names the production one instead.
        type: string
        default: ''
      web-only:
        description: >-
          Build the web app and nothing else. The development release wants the
          image and only the image, and android, linux and windows together are
          the bulk of the run.
        type: boolean
        default: false
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/flutter-*.yml'

# Four platforms is not a cheap run, and a second push to a branch makes the
# one already going pointless. A tag is left alone: a release that gets
# cancelled halfway leaves half a release behind.
concurrency:
  group: flutter-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Building is reading: the code comes out of the checkout and the results leave
# as artifacts, which upload-artifact does without the token.
permissions:
  contents: read

env:
  BUILD_ARGS: ${{ inputs.build-args }}

defaults:
  run:
    working-directory: frontend

jobs:
  # Also where the Flutter version comes from: flutter-test.yml pins it and
  # hands it out, so every job below builds with the SDK the tests ran on and
  # the version is written down in one place.
  test:
    uses: ./.github/workflows/flutter-test.yml

  android:
    needs: test
    if: ${{ !inputs.web-only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 17, to match the sourceCompatibility the app module asks for.
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.test.outputs.flutter-version }}
          channel: stable
          cache: true

      # Absent the secrets this writes nothing and the build falls back to the
      # debug key (see android/app/build.gradle.kts), so a fork still gets an
      # APK it can install — just not one the Play Store will take.
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signing the release with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # assets/config.json is read at start-up rather than compiled in, but on
      # every platform but the web it is read out of the bundle this build
      # writes — so pointing a release at the production server is something
      # that has to happen before the build, not to the artifact afterwards.
      - name: Configuration
        if: ${{ inputs.config != '' }}
        run: cp "${{ inputs.config }}" assets/config.json

      - name: Dependencies
        run: flutter pub get

      - name: APK
        run: flutter build apk --release $BUILD_ARGS

      - name: App bundle
        run: flutter build appbundle --release $BUILD_ARGS

      - name: Collect
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/score-$version-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/score-$version-android.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: frontend/dist/
          if-no-files-found: error

  linux:
    needs: test
    if: ${{ !inputs.web-only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # libwebkit2gtk is not on Flutter's own list of Linux desktop
      # prerequisites. It is here because flutter_web_auth_2 depends on
      # desktop_webview_window, whose Linux plugin links against it. The app
      # never opens that webview — on Linux the sign-in hands the browser the
      # address and catches the callback on a local port (see
      # lib/features/auth/authorizer_native.dart) — but the plugin is linked
      # all the same, so the bundle will not even start on a machine without
      # the runtime library, libwebkit2gtk-4.1-0. The README and the release
      # notes say so.
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libwebkit2gtk-4.1-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.test.outputs.flutter-version }}
          channel: stable
          cache: true

      # assets/config.json is read at start-up rather than compiled in, but on
      # every platform but the web it is read out of the bundle this build
      # writes — so pointing a release at the production server is something
      # that has to happen before the build, not to the artifact afterwards.
      - name: Configuration
        if: ${{ inputs.config != '' }}
        run: cp "${{ inputs.config }}" assets/config.json

      - name: Dependencies
        run: flutter pub get

      - name: Build
        run: flutter build linux --release $BUILD_ARGS

      - name: Collect
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          tar -czf "dist/score-$version-linux-x64.tar.gz" \
            -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: frontend/dist/
          if-no-files-found: error

  windows:
    needs: test
    if: ${{ !inputs.web-only }}
    runs-on: windows-latest
    defaults:
      run:
        # bash, so the packaging below reads the same as the other three jobs.
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.test.outputs.flutter-version }}
          channel: stable
          cache: true

      # assets/config.json is read at start-up rather than compiled in, but on
      # every platform but the web it is read out of the bundle this build
      # writes — so pointing a release at the production server is something
      # that has to happen before the build, not to the artifact afterwards.
      - name: Configuration
        if: ${{ inputs.config != '' }}
        run: cp "${{ inputs.config }}" assets/config.json

      - name: Dependencies
        run: flutter pub get

      - name: Build
        run: flutter build windows --release $BUILD_ARGS

      - name: Collect
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          cd build/windows/x64/runner/Release
          7z a -tzip \
            "$GITHUB_WORKSPACE/frontend/dist/score-$version-windows-x64.zip" ./*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: frontend/dist/
          if-no-files-found: error

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.test.outputs.flutter-version }}
          channel: stable
          cache: true

      # The web app fetches assets/config.json from the server when it starts,
      # so here, unlike on the other platforms, the file could be swapped after
      # the build. It is put in place before it anyway, so that the zip and the
      # image built from web-build both carry the same one, and so that the
      # hash the service worker keeps for it (see below) is the hash of the
      # file that is actually served.
      - name: Configuration
        if: ${{ inputs.config != '' }}
        run: cp "${{ inputs.config }}" assets/config.json

      - name: Dependencies
        run: flutter pub get

      # --no-web-resources-cdn: CanvasKit is served with the app rather than
      # fetched from Google's CDN, which is what lets the app start where there
      # is no network. The service worker is then told which files to keep; see
      # web/service-worker.js and tool/precache.dart.
      - name: Build
        run: flutter build web --release --no-web-resources-cdn $BUILD_ARGS

      - name: Keep the app for use without a network
        run: dart run tool/precache.dart build/web

      - name: Collect
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          (cd build/web && zip -qr \
            "$GITHUB_WORKSPACE/frontend/dist/score-$version-web.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: frontend/dist/
          if-no-files-found: error

      # Unpacked as well as zipped: the release workflow builds the nginx image
      # straight from this rather than running the web build a second time.
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: frontend/build/web/
          if-no-files-found: error
