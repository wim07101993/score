name: Test

on:
  workflow_call:
  workflow_dispatch:
  pull_request:

jobs:
  # The openapi document as a document: that it is valid, that every reference
  # lands, and that an operation says who may call it and what it answers. The
  # backend job checks that the generated server matches it; this checks that it
  # is worth generating from. Its settings are in redocly.yaml.
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Pinned: a new release of the linter brings new rules, and the day those
      # start failing should be a day somebody chose.
      - name: Lint the openapi document
        run: npx --yes @redocly/cli@2.44.1 lint

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: The generated api is the one the openapi document describes
        run: |
          go generate ./...
          git diff --exit-code internal/api

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      # The integration tests download postgres from maven central on every run,
      # and maven being briefly unreachable is reported as "no version found".
      # Keyed on what decides which binary is fetched: the library and the
      # version the helper asks for.
      - uses: actions/cache@v6
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-${{ hashFiles('go.sum', 'test/integration_test/helpers/postgres.go') }}

      - name: Integration tests
        run: go test -tags integration ./test/...
