name: Build Docker image

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-backend:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Build the Docker image
      run: docker build . --file backend.Dockerfile
