include: package:lint/strict.yaml # For production apps

linter:
  rules:
    # `Smufl` is the table of every glyph the renderer knows, and `_Spacing`
    # and `EngravingDefaults` are the numbers a score is engraved by. They are
    # namespaces rather than objects, and spilling those names into the top
    # level to be rid of the class would be the worse code.
    avoid_classes_with_only_static_members: false

    # The dependencies are grouped by what they are for, with a note above each
    # group saying so. Alphabetical order would scatter the groups and take the
    # notes with them.
    sort_pub_dependencies: false
