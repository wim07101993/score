name: score
description: Sheet music, drawn and played from.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # The score engine. Everything a score is drawn from is parsed with this;
  # nothing else here knows what MusicXML looks like.
  xml: ^6.5.0

  # Talking to the API and to the identity provider.
  http: ^1.2.2
  crypto: ^3.0.5

  # What is kept between visits. One store that works the same on a browser
  # (IndexedDB) and on a device (a file), so the repositories never ask which
  # one they are on.
  sembast: ^3.7.4
  sembast_web: ^2.4.0+4
  path_provider: ^2.1.4
  path: ^1.9.0

  # Signing in. On a device this opens the provider and catches the callback;
  # on the web the page itself is the callback, so it is not used there.
  flutter_web_auth_2: ^5.0.3

  # Reading a score off the device and writing one back to it.
  file_picker: ^11.0.3

  uuid: ^4.5.1
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/config.json

  fonts:
    # The reference SMuFL font. Every notehead, clef, rest and accidental on
    # screen is a glyph out of this, positioned by the metrics that ship with
    # it (lib/notation/render/smufl.dart).
    - family: Bravura
      fonts:
        - asset: assets/fonts/Bravura.otf
